schema_version: 1

context:
  version: 8.1.0

package:
  name: social-auth-app-django
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/social-auth-app-django/social_auth_app_django-${{ version }}.tar.gz
  sha256: df67120883ca1cbeb71843159b042ac82f719d4f777082a350ad94e4b3f74811

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=78.0.2
    - pip
  run:
    - python >=${{ python_min }}
    - asgiref >=3.8.1
    - django >=5.2
    - social-auth-core >=7.2.0,<8.0.0
tests:
  - python:
      imports:
        - social_django
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Python Social Authentication, Django integration.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/python-social-auth/social-app-django

extra:
  recipe-maintainers:
    - ocefpaf
