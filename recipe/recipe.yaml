schema_version: 1

context:
  version: 5.4.3

package:
  name: social-auth-app-django
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/social-auth-app-django/social_auth_app_django-${{ version }}.tar.gz
  sha256: d1f4286d5ca1e512c9b2f686e7ecb2a0128148f1a33d853b69dc07b58508362e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=78.0.2
    - pip
  run:
    - python >=${{ python_min }}
    - asgiref >=3.8.1
    - django >=3.2,<5.0
    - social-auth-core >=4.1.0,<5.0.0
tests:
  - python:
      imports:
        - social_django
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Python Social Authentication, Django integration.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/python-social-auth/social-app-django

extra:
  recipe-maintainers:
    - ocefpaf
